<html lang="id">

<head>
    <meta charset="UTF-8">

    <style>
        /* CSS Tambahan Khusus Pengendali Sakelar Divisi Bisnis */
        .divisi-switcher-bar {
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 12px 10px;
            position: sticky;
            top: 0;
            z-index: 99999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .switch-btn {
            background: transparent;
            color: #94a3b8;
            border: 2px solid #334155;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch-btn:hover {
            color: #ffffff;
            border-color: #64748b;
        }

        .switch-btn.active-finansial {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
            box-shadow: 0 0 12px rgba(13, 110, 253, 0.4);
        }

        .switch-btn.active-pangan {
            background-color: #e67e22;
            color: white;
            border-color: #e67e22;
            box-shadow: 0 0 12px rgba(230, 126, 34, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Penyesuaian header bawaan Anda agar berada di bawah Switcher Bar */
        header {
            position: sticky !important;
            top: 64px !important; /* Menyesuaikan tinggi Switcher Bar */
            z-index: 9998 !important;
        }

        /* Sektor Gaya CSS Khusus Halaman Distributor Pangan/Telur */
        .pangan-body {
            background-color: #f8f9fa;
            color: #333333;
            padding-bottom: 60px;
        }

        .pangan-hero {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 60px 5%;
            text-align: center;
            position: relative;
        }

        .pangan-hero h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
        .pangan-hero p { font-size: 1.1rem; max-width: 650px; margin: 0 auto; opacity: 0.95; line-height: 1.6; }

        .pangan-container {
            max-width: 1140px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .pangan-container { grid-template-columns: 1fr; }
            .pangan-hero h1 { font-size: 1.8rem; }
        }

        .pangan-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        body.dark-mode .pangan-card {
            background: #22252a;
            border-color: #333942;
            color: #ffffff;
        }

        .pangan-card h2 {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }
        body.dark-mode .pangan-card h2 { color: #ffffff; border-bottom-color: #333942; }

        .pangan-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .pangan-table th, .pangan-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        body.dark-mode .pangan-table th, body.dark-mode .pangan-table td { border-bottom-color: #333942; }

        .pangan-table th { background-color: #f8f9fa; font-weight: 600; color: #1e293b; }
        body.dark-mode .pangan-table th { background-color: #1a1d21; color: #ffffff; }

        .calc-form-group { margin-bottom: 20px; }
        .calc-form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1e293b; }
        body.dark-mode .calc-form-group label { color: #ffffff; }
        
        .calc-form-group select, .calc-form-group input {
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none;
        }
        body.dark-mode .calc-form-group select, body.dark-mode .calc-form-group input { background: #1a1d21; color: white; border-color: #333942; }

        .pangan-calc-result {
            background: #fffaf0;
            border: 1px dashed #e67e22;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        body.dark-mode .pangan-calc-result { background: #2c251e; }

        .pangan-calc-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        .pangan-calc-total { border-top: 1px solid #e2e8f0; padding-top: 10px; margin-top: 10px; font-weight: 700; font-size: 17px; color: #e67e22; }
        body.dark-mode .pangan-calc-total { border-top-color: #333942; }

        .pangan-btn-wa {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background-color: #25d366; color: white; text-decoration: none;
            padding: 14px; border-radius: 8px; font-weight: 600; font-size: 15px;
            width: 100%; border: none; cursor: pointer; margin-top: 20px; transition: background 0.2s; font-family: 'Poppins', sans-serif;
        }
        .pangan-btn-wa:hover { background-color: #1ebd59; }

        .pangan-info-grosir {
            max-width: 1140px; margin: 10px auto 40px; padding: 0 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;
        }
        .info-grosir-item { background: white; padding: 25px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        body.dark-mode .info-grosir-item { background: #22252a; border-color: #333942; color: white; }
        .info-grosir-item i { color: #e67e22; font-size: 28px; margin-bottom: 12px; }
        .info-grosir-item h3 { font-size: 16px; margin-bottom: 8px; font-weight: 600; }
        .info-grosir-item p { font-size: 13px; color: #666666; margin: 0; line-height: 1.5; }
        body.dark-mode .info-grosir-item p { color: #b0b3b8; }
    </style>
</head>

<body>
